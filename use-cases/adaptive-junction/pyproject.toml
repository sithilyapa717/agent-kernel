[project]
name = "adaptive-junction"
version = "0.1.0"
description = "Agent Kernel adaptive 4-way junction advisor (SDG 11) with Slack, CLI, and live dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentkernel[cli,openai,api,slack]>=0.8.1",
    "sqlalchemy>=2.0.36",
    "websockets>=14.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "agentkernel[test]>=0.8.1",
    "black>=23.0.0",
    "isort>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
